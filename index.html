<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lessbot</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --header: #ffffff;
      --text: #0f172a;
      --muted: #6b7280;
      --border: #e5e7eb;
      --ai-bubble: #f1f3f7;
      --ai-text: #0f172a;
      --user-bubble: linear-gradient(135deg, #2563eb, #3b82f6);
      --user-text: #ffffff;
      --input-bg: #f8fafc;
      --input-border: #e2e8f0;
      --input-text: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --avatar-bg: #e0e7ff;
      --avatar-text: #3730a3;
    }

    html[data-theme="dark"] {
      --bg: #0a0c10;
      --card: #12151b;
      --header: #12151b;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #232833;
      --ai-bubble: #1c2129;
      --ai-text: #e5e7eb;
      --user-bubble: linear-gradient(135deg, #3b82f6, #6366f1);
      --user-text: #ffffff;
      --input-bg: #1a1e26;
      --input-border: #2a303b;
      --input-text: #e5e7eb;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      --avatar-bg: #1e293b;
      --avatar-text: #93c5fd;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s ease, color 0.25s ease;
    }

    #chat-container {
      width: 100%;
      max-width: 780px;
      height: 100vh;
      background: var(--card);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.25s ease;
      position: relative;
    }

    @media (min-width: 720px) {
      body { padding: 2rem; }
      #chat-container {
        height: 88vh;
        border-radius: 20px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
      }
    }

    /* ---------- Header ---------- */
    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.9rem 1.1rem;
      border-bottom: 1px solid var(--border);
      background: var(--header);
      transition: background 0.25s ease, border-color 0.25s ease;
      flex-shrink: 0;
    }

    .bot-avatar {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #6366f1);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
    }

    .bot-info {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
      flex: 1;
      min-width: 0;
    }

    .bot-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .bot-status {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
    }

    #theme-toggle {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
      flex-shrink: 0;
    }

    #theme-toggle:hover {
      background: var(--ai-bubble);
      transform: translateY(-1px);
    }

    #theme-toggle:active { transform: translateY(0); }

    #theme-toggle svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Show only the right icon per theme */
    #icon-sun, #icon-moon { display: none; }
    html[data-theme="light"] #icon-moon { display: block; }
    html[data-theme="dark"]  #icon-sun  { display: block; }

    /* ---------- Messages ---------- */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1.1rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 8px; }
    #messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 8px;
    }

    /* ---------- Welcome screen ---------- */
    #welcome {
      position: absolute;
      inset: 60px 0 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    #welcome.hidden { opacity: 0; }

    .welcome-avatar {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563eb, #6366f1);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.6rem;
      margin-bottom: 1rem;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.3);
    }

    .welcome-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 0 0 0.4rem;
    }

    .welcome-sub {
      color: var(--muted);
      font-size: 0.9rem;
      max-width: 320px;
      line-height: 1.5;
      margin: 0;
    }

    /* ---------- Message rows ---------- */
    .row {
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
      animation: fadeUp 0.25s ease both;
    }

    .row.user { flex-direction: row-reverse; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.78rem;
      flex-shrink: 0;
      background: var(--avatar-bg);
      color: var(--avatar-text);
    }

    .row.user .msg-avatar {
      background: linear-gradient(135deg, #2563eb, #6366f1);
      color: #fff;
    }

    .bubble {
      padding: 0.7rem 0.95rem;
      border-radius: 16px;
      font-size: 0.94rem;
      line-height: 1.5;
      max-width: 76%;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .row.ai .bubble {
      background: var(--ai-bubble);
      color: var(--ai-text);
      border-bottom-left-radius: 6px;
    }

    .row.user .bubble {
      background: var(--user-bubble);
      color: var(--user-text);
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.22);
    }

    /* ---------- Typing dots ---------- */
    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      padding: 0.15rem 0.1rem;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      opacity: 0.4;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30%           { transform: translateY(-4px); opacity: 1; }
    }

    /* ---------- Input area ---------- */
    #input-area {
      padding: 0.9rem 1rem calc(0.9rem + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: var(--card);
      flex-shrink: 0;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .input-wrap {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 20px;
      padding: 0.35rem 0.35rem 0.35rem 0.9rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    #input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--input-text);
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.4;
      resize: none;
      max-height: 140px;
      padding: 0.5rem 0;
      scrollbar-width: none;
    }

    #input::-webkit-scrollbar { display: none; }

    #input::placeholder { color: var(--muted); }

    #send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
    }

    #send-btn:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    #send-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #send-btn svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .hint {
      font-size: 0.7rem;
      color: var(--muted);
      text-align: center;
      margin-top: 0.55rem;
      user-select: none;
    }

    @media (max-width: 480px) {
      .hint { display: none; }
      .bubble { max-width: 82%; }
    }
  </style>
</head>
<body>
  <div id="chat-container">
    <header>
      <div class="bot-avatar">L</div>
      <div class="bot-info">
        <div class="bot-name">Lessbot</div>
        <div class="bot-status"><span class="status-dot"></span>Online</div>
      </div>
      <button id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
        <svg id="icon-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg id="icon-moon" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <div id="messages"></div>

    <div id="welcome">
      <div class="welcome-avatar">L</div>
      <h2 class="welcome-title">Hi, I'm Lessbot 👋</h2>
      <p class="welcome-sub">Ask me anything — I'll answer honestly and try to be a genuinely helpful friend.</p>
    </div>

    <div id="input-area">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="Message Lessbot..." autocomplete="off"></textarea>
        <button id="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24">
            <path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a1 1 0 0 0-1.39 1.12L3.5 11l11.5 1-11.5 1-1.49 6.28a1 1 0 0 0 1.39 1.12z"/>
          </svg>
        </button>
      </div>
      <div class="hint">Enter to send · Shift + Enter for new line</div>
    </div>
  </div>

  <script>
    // ---------- Theme ----------
    const themeToggle = document.getElementById('theme-toggle');
    const root = document.documentElement;

    function applyTheme(theme) {
      root.setAttribute('data-theme', theme);
    }

    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(savedTheme || (systemPrefersDark ? 'dark' : 'light'));

    themeToggle.addEventListener('click', () => {
      const current = root.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      localStorage.setItem('theme', next);
    });

    // ---------- Chat ----------
    const messagesDiv = document.getElementById('messages');
    const welcome = document.getElementById('welcome');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');

    let conversation = [];
    let isWaiting = false;

    // Auto-grow the textarea
    function autoGrow() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    }
    input.addEventListener('input', autoGrow);

    function scrollToBottom() {
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function makeRow(role, html) {
      const row = document.createElement('div');
      row.className = `row ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = role === 'user' ? 'You' : 'L';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (html) bubble.innerHTML = html;
      else bubble.textContent = '';

      row.appendChild(avatar);
      row.appendChild(bubble);
      messagesDiv.appendChild(row);
      scrollToBottom();
      return bubble;
    }

    function addTextMessage(role, text) {
      const bubble = makeRow(role, '');
      bubble.textContent = text;
    }

    function addTyping() {
      const bubble = makeRow('ai', '');
      bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
      return bubble.closest('.row');
    }

    async function send() {
      const text = input.value.trim();
      if (!text || isWaiting) return;

      isWaiting = true;
      sendBtn.disabled = true;
      input.value = '';
      autoGrow();

      welcome.classList.add('hidden');

      addTextMessage('user', text);
      conversation.push({ role: 'user', content: text });

      const typingRow = addTyping();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: conversation })
        });
        const data = await res.json();

        typingRow.remove();

        if (data.error) {
          addTextMessage('ai', `⚠️ Error: ${data.error}`);
        } else {
          const reply = data.choices[0].message.content;
          addTextMessage('ai', reply);
          conversation.push({ role: 'assistant', content: reply });
        }
      } catch (err) {
        typingRow.remove();
        addTextMessage('ai', `⚠️ Network error: ${err.message}`);
      }

      isWaiting = false;
      sendBtn.disabled = false;
      input.focus();
    }

    sendBtn.addEventListener('click', send);

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    // Focus on load
    window.addEventListener('load', () => input.focus());
  </script>
</body>
</html>
