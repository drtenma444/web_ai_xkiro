<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lessbot</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="shell">
    <aside id="sidebar">
      <div class="sidebar-top">
        <button class="new-chat-btn" id="new-chat-btn">
          <svg viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New chat</span>
        </button>
      </div>
      <div class="sidebar-label">Chats</div>
      <div id="conversation-list"></div>
    </aside>

    <div id="main">
      <div id="app" class="state-initial">
        <header>
          <button class="icon-btn" id="sidebar-toggle" aria-label="Toggle sidebar">
            <svg viewBox="0 0 24 24">
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="brand">Lessbot</div>
        </header>

        <div id="body">
          <div id="welcome">
            <h1>Hi. How can I help?</h1>
          </div>

          <div id="messages"></div>

          <div id="input-area">
            <div class="input-wrap">
              <textarea id="input" rows="1" placeholder="Message Lessbot" autocomplete="off"></textarea>
              <div class="input-actions">
                <button type="button" id="search-toggle" class="search-toggle" aria-label="Toggle web search" title="Search the web">
                  <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M3 12h18"></path>
                    <path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"></path>
                  </svg>
                  <span>Search</span>
                </button>
                <button id="send-btn" aria-label="Send">
                  <svg class="icon-send" viewBox="0 0 24 24">
                    <path d="M12 19V5"></path>
                    <path d="M6 11l6-6 6 6"></path>
                  </svg>
                  <svg class="icon-stop" viewBox="0 0 24 24" style="display:none">
                    <rect x="7" y="7" width="10" height="10" rx="1.5"></rect>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="backdrop"></div>

  <!-- Libraries from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Your app code -->
  <script src="app.js"></script>
</body>
</html>
