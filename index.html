<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lessbot</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

  <style>
    :root {
      --bg: #151517;
      --text: #ececec;
      --muted: #8a8a8e;
      --border: #2a2a2d;
      --hover: rgba(255, 255, 255, 0.06);
      --user-bubble: #2c2c2e;
      --user-text: #ececec;
      --input-bg: #2c2c2e;
      --input-border: #2c2c2e;
      --input-text: #ececec;
      --send-bg: #4d6bfe;
      --send-text: #ffffff;
      --send-disabled: #3a3a3d;
      --code-bg: #1c1c1e;
      --code-header-bg: #232326;
      --inline-code-bg: #2c2c2e;
      --link: #6b8aff;
      --quote-border: #38383c;
      --accent: #4d6bfe;
      --sidebar-bg: #1a1a1c;
      --sidebar-width: 260px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.55;
      overflow: hidden;
    }

    /* ---------- App shell ---------- */
    #shell {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* ---------- Sidebar ---------- */
    #sidebar {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.2s ease, transform 0.2s ease;
      overflow: hidden;
    }
    #shell.sidebar-collapsed #sidebar {
      width: 0;
      border-right: none;
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 0.85rem 0.5rem;
    }

    .new-chat-btn {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      border: 1px solid #3a3a3d;
      color: var(--text);
      padding: 0.55rem 0.75rem;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
      text-align: left;
    }
    .new-chat-btn:hover { background: var(--hover); border-color: #4a4a4e; }
    .new-chat-btn svg {
      width: 14px; height: 14px;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      flex-shrink: 0;
    }

    .sidebar-label {
      padding: 0.75rem 1.1rem 0.35rem;
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    #conversation-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 0.5rem 0.75rem;
    }
    #conversation-list::-webkit-scrollbar { width: 6px; }
    #conversation-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 6px;
    }

    .conv-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      cursor: pointer;
      color: var(--muted);
      font-size: 0.85rem;
      transition: background 0.1s ease, color 0.1s ease;
      white-space: nowrap;
      overflow: hidden;
    }
    .conv-item:hover { background: var(--hover); color: var(--text); }
    .conv-item.active { background: var(--hover); color: var(--text); }

    .conv-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conv-delete {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
    }
    .conv-item:hover .conv-delete { display: flex; }
    .conv-delete:hover { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    .conv-delete svg {
      width: 12px; height: 12px;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    .empty-convs {
      padding: 0.75rem 1.1rem;
      font-size: 0.8rem;
      color: var(--muted);
      font-style: italic;
    }

    /* ---------- Main area ---------- */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    /* ---------- Header ---------- */
    header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 1.5rem;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
      transition: background 0.15s ease;
    }
    .icon-btn:hover { background: var(--hover); }
    .icon-btn svg {
      width: 17px; height: 17px;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    .brand {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    /* ---------- Body ---------- */
    #body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    #welcome {
      display: none;
      text-align: center;
    }
    #welcome h1 {
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin: 0;
    }

    #messages {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1.5rem 1rem;
      flex-direction: column;
      gap: 1.5rem;
      scroll-behavior: smooth;
      min-height: 0;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 6px;
    }

    #input-area {
      flex-shrink: 0;
      width: 100%;
    }

    #app.state-initial #body {
      justify-content: flex-start;
      padding-top: clamp(120px, 28vh, 320px);
      padding-left: 1.5rem;
      padding-right: 1.5rem;
      padding-bottom: 2rem;
    }
    #app.state-initial #welcome {
      display: block;
      margin-bottom: 1.5rem;
    }
    #app.state-initial #input-area {
      max-width: 720px;
      margin: 0 auto;
    }

    #app.state-chatting #messages { display: flex; }
    #app.state-chatting #input-area {
      padding: 1rem 1.5rem calc(1rem + env(safe-area-inset-bottom));
    }

    /* ---------- Message rows ---------- */
    .msg {
      display: flex;
      flex-direction: column;
      animation: fade 0.2s ease both;
    }
    @keyframes fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .msg.user { align-items: flex-end; }

    .msg-content {
      max-width: 100%;
      word-wrap: break-word;
      min-width: 0;
    }

    .msg.user .msg-content {
      background: var(--user-bubble);
      color: var(--user-text);
      padding: 0.65rem 1rem;
      border-radius: 18px;
      border-bottom-right-radius: 6px;
      max-width: 78%;
      white-space: pre-wrap;
    }

    .msg.ai .msg-content {
      color: var(--text);
      max-width: 100%;
    }

    .msg-actions {
      display: flex;
      gap: 0.25rem;
      margin-top: 0.35rem;
      opacity: 0.6;
      transition: opacity 0.15s ease;
    }
    .msg:hover .msg-actions { opacity: 1; }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .copy-btn:hover { background: var(--hover); color: var(--text); }
    .copy-btn.copied { color: #10b981; }

    .copy-btn svg {
      width: 13px; height: 13px;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ---------- Typing dots ---------- */
    .typing { display: inline-flex; gap: 4px; align-items: center; padding: 0.35rem 0; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted); opacity: 0.5;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30%           { transform: translateY(-4px); opacity: 1; }
    }

    .stream-cursor {
      display: inline-block;
      width: 7px;
      height: 15px;
      background: var(--text);
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: blink 1s step-end infinite;
      border-radius: 1px;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* ---------- Markdown ---------- */
    .msg.ai .msg-content > *:first-child { margin-top: 0; }
    .msg.ai .msg-content > *:last-child  { margin-bottom: 0; }

    .msg.ai p { margin: 0.6em 0; }
    .msg.ai h1, .msg.ai h2, .msg.ai h3, .msg.ai h4 {
      margin: 1.1em 0 0.5em;
      font-weight: 600;
      line-height: 1.3;
    }
    .msg.ai h1 { font-size: 1.35em; }
    .msg.ai h2 { font-size: 1.2em; }
    .msg.ai h3 { font-size: 1.05em; }
    .msg.ai h4 { font-size: 1em; }

    .msg.ai ul, .msg.ai ol {
      margin: 0.6em 0;
      padding-left: 1.5em;
    }
    .msg.ai li { margin: 0.25em 0; }

    .msg.ai a { color: var(--link); text-decoration: none; }
    .msg.ai a:hover { text-decoration: underline; }

    .msg.ai blockquote {
      border-left: 3px solid var(--quote-border);
      padding: 0 1em;
      margin: 0.75em 0;
      color: var(--muted);
    }

    .msg.ai hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.2em 0;
    }

    .msg.ai code:not(.hljs) {
      background: var(--inline-code-bg);
      padding: 0.15em 0.4em;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.88em;
    }

    .msg.ai table {
      border-collapse: collapse;
      margin: 0.75em 0;
      font-size: 0.9em;
    }
    .msg.ai th, .msg.ai td {
      border: 1px solid var(--border);
      padding: 0.4em 0.75em;
      text-align: left;
    }
    .msg.ai th { background: var(--code-header-bg); font-weight: 600; }

    .msg.ai img { max-width: 100%; border-radius: 8px; }

    /* ---------- Code blocks ---------- */
    .code-block {
      margin: 0.85em 0;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0.6rem 0.45rem 0.85rem;
      background: var(--code-header-bg);
      border-bottom: 1px solid var(--border);
    }

    .code-lang {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: lowercase;
    }

    .code-copy {
      padding: 0.3rem 0.5rem;
      font-size: 0.72rem;
    }

    .code-block pre {
      margin: 0;
      padding: 0.9rem 1rem;
      overflow-x: auto;
      background: var(--code-bg);
    }

    .code-block code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      line-height: 1.55;
      background: transparent;
      padding: 0;
    }

    /* ---------- Input box ---------- */
    .input-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 22px;
      padding: 0.9rem 0.75rem 0.7rem 1.1rem;
      transition: border-color 0.15s ease;
    }
    .input-wrap:focus-within { border-color: #3a3a3d; }

    #input {
      width: 100%;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      color: var(--input-text);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      max-height: 180px;
      padding: 0.15rem 0 0.5rem;
      scrollbar-width: none;
    }
    #input::-webkit-scrollbar { display: none; }
    #input::placeholder { color: var(--muted); }

    .input-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .search-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid #4a4a4e;
      color: #d0d0d4;
      padding: 5px 11px;
      border-radius: 16px;
      font-size: 12.5px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .search-toggle:hover {
      background: var(--hover);
      color: var(--text);
    }
    .search-toggle.active {
      background: rgba(107, 138, 255, 0.18);
      color: #8aa3ff;
      border-color: rgba(138, 163, 255, 0.65);
    }
    .search-toggle svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #send-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--send-bg);
      color: var(--send-text);
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
      transition: opacity 0.15s ease, transform 0.1s ease, background 0.15s ease;
    }
    #send-btn:hover:not(:disabled) { opacity: 0.9; }
    #send-btn:active:not(:disabled) { transform: scale(0.94); }
    #send-btn:disabled {
      background: var(--send-disabled);
      cursor: not-allowed;
      color: var(--muted);
    }
    #send-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
    }
    #send-btn .icon-stop {
      fill: currentColor;
      stroke: none;
    }

    /* ---------- Mobile overlay ---------- */
    #backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 5;
    }
    #backdrop.visible { display: block; }

    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 10;
        width: 260px;
        transform: translateX(-100%);
      }
      #shell.sidebar-mobile-open #sidebar {
        transform: translateX(0);
      }
      #shell.sidebar-collapsed #sidebar {
        /* On mobile, collapsed means translated off-screen */
        width: 260px;
        transform: translateX(-100%);
      }
      #shell.sidebar-mobile-open #sidebar {
        width: 260px;
        transform: translateX(0);
      }
    }

    /* ---------- Responsive tweaks ---------- */
    @media (max-width: 640px) {
      header { padding: 0.85rem 1rem; }

      #app.state-initial #body {
        padding-top: clamp(90px, 22vh, 180px);
        padding-left: 1rem;
        padding-right: 1rem;
        padding-bottom: 1.5rem;
      }
      #welcome h1 { font-size: 1.4rem; }

      #app.state-chatting #input-area {
        padding: 0.75rem 0.85rem calc(0.75rem + env(safe-area-inset-bottom));
      }
      #messages {
        padding: 1rem 0.85rem 0.75rem;
        gap: 1.25rem;
      }
      .msg.user .msg-content { max-width: 85%; }

      .input-wrap {
        padding: 0.75rem 0.65rem 0.6rem 0.9rem;
        border-radius: 20px;
      }
      #send-btn { width: 30px; height: 30px; }

      .search-toggle {
        padding: 4px 9px;
        font-size: 12px;
        gap: 5px;
      }
    }
  </style>
</head>
<body>
  <div id="shell">
    <aside id="sidebar">
      <div class="sidebar-top">
        <button class="new-chat-btn" id="new-chat-btn">
          <svg viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New chat</span>
        </button>
      </div>
      <div class="sidebar-label">Chats</div>
      <div id="conversation-list"></div>
    </aside>

    <div id="main">
      <div id="app" class="state-initial">
        <header>
          <button class="icon-btn" id="sidebar-toggle" aria-label="Toggle sidebar">
            <svg viewBox="0 0 24 24">
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="brand">Lessbot</div>
        </header>

        <div id="body">
          <div id="welcome">
            <h1>Hi. How can I help?</h1>
          </div>

          <div id="messages"></div>

          <div id="input-area">
            <div class="input-wrap">
              <textarea id="input" rows="1" placeholder="Message Lessbot" autocomplete="off"></textarea>
              <div class="input-actions">
                <button type="button" id="search-toggle" class="search-toggle" aria-label="Toggle web search" title="Search the web">
                  <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M3 12h18"></path>
                    <path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"></path>
                  </svg>
                  <span>Search</span>
                </button>
                <button id="send-btn" aria-label="Send">
                  <svg class="icon-send" viewBox="0 0 24 24">
                    <path d="M12 19V5"></path>
                    <path d="M6 11l6-6 6 6"></path>
                  </svg>
                  <svg class="icon-stop" viewBox="0 0 24 24" style="display:none">
                    <rect x="7" y="7" width="10" height="10" rx="1.5"></rect>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="backdrop"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script>
    // ---------- Constants ----------
    const COPY_SVG = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
    const CHECK_SVG = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>';
    const TRASH_SVG = '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path></svg>';

    const STORAGE_KEY = 'lessbot_conversations_v1';
    const ACTIVE_KEY = 'lessbot_active_id';

    // ---------- Markdown ----------
    const escapeHtml = (s) => String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    const renderer = new marked.Renderer();

    renderer.code = (code, infostring) => {
      const info = (infostring || '').trim();
      const lang = (info.split(/\s+/)[0] || 'text').toLowerCase();
      const safeLang = escapeHtml(lang);
      let highlighted;
      try {
        if (lang !== 'text' && window.hljs && hljs.getLanguage(lang)) {
          highlighted = hljs.highlight(code, { language: lang }).value;
        } else if (window.hljs) {
          highlighted = hljs.highlightAuto(code).value;
        } else {
          highlighted = escapeHtml(code);
        }
      } catch (e) {
        highlighted = escapeHtml(code);
      }
      return `<div class="code-block">
        <div class="code-header">
          <span class="code-lang">${safeLang}</span>
        </div>
        <pre><code class="hljs">${highlighted}</code></pre>
      </div>`;
    };

    renderer.link = (href, title, text) => {
      const t = title ? ` title="${escapeHtml(title)}"` : '';
      return `<a href="${href}"${t} target="_blank" rel="noopener noreferrer">${text}</a>`;
    };

    marked.setOptions({ renderer, breaks: true, gfm: true });

    function renderMarkdown(text) {
      const raw = marked.parse(text);
      return DOMPurify.sanitize(raw, { ADD_ATTR: ['target'] });
    }

    // ---------- Storage ----------
    function loadStore() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        console.error('loadStore failed:', e);
        return [];
      }
    }

    function saveStore(store) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
      } catch (e) {
        console.error('saveStore failed:', e);
      }
    }

    function getActiveId() { return localStorage.getItem(ACTIVE_KEY); }
    function setActiveId(id) {
      if (id) localStorage.setItem(ACTIVE_KEY, id);
      else localStorage.removeItem(ACTIVE_KEY);
    }

    function makeTitle(text) {
      const t = (text || '').trim().replace(/\s+/g, ' ');
      if (!t) return 'New chat';
      return t.length > 40 ? t.slice(0, 40).trim() + '…' : t;
    }

    // ---------- DOM ----------
    const shell = document.getElementById('shell');
    const sidebar = document.getElementById('sidebar');
    const convList = document.getElementById('conversation-list');
    const newChatBtn = document.getElementById('new-chat-btn');
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const backdrop = document.getElementById('backdrop');

    const app = document.getElementById('app');
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const searchToggle = document.getElementById('search-toggle');
    const iconSend = sendBtn.querySelector('.icon-send');
    const iconStop = sendBtn.querySelector('.icon-stop');

    // ---------- State ----------
    let store = loadStore();      // array of { id, title, createdAt, updatedAt, messages }
    let activeId = getActiveId();
    let conversation = [];         // messages of the currently open chat
    let isWaiting = false;
    let webSearchEnabled = false;
    let currentAbortController = null;

    // ---------- Sidebar toggle ----------
    function isMobile() { return window.innerWidth <= 768; }

    sidebarToggle.addEventListener('click', () => {
      if (isMobile()) {
        const isOpen = shell.classList.toggle('sidebar-mobile-open');
        backdrop.classList.toggle('visible', isOpen);
      } else {
        shell.classList.toggle('sidebar-collapsed');
      }
    });

    backdrop.addEventListener('click', () => {
      shell.classList.remove('sidebar-mobile-open');
      backdrop.classList.remove('visible');
    });

    // On desktop, ensure sidebar is visible by default
    if (!isMobile()) {
      shell.classList.remove('sidebar-collapsed');
    } else {
      // On mobile, start with sidebar collapsed (hidden)
      shell.classList.add('sidebar-collapsed');
    }

    // ---------- Search toggle ----------
    searchToggle.addEventListener('click', () => {
      webSearchEnabled = !webSearchEnabled;
      searchToggle.classList.toggle('active', webSearchEnabled);
    });

    // ---------- Auto-grow textarea ----------
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 180) + 'px';
    });

    // ---------- Smart scroll ----------
    let stickToBottom = true;
    messagesDiv.addEventListener('scroll', () => {
      const d = messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight;
      stickToBottom = d < 60;
    });
    function scrollToBottom(force = false) {
      if (force || stickToBottom) messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // ---------- Copy button ----------
    function createCopyButton(getText) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'copy-btn';
      btn.innerHTML = COPY_SVG + '<span>Copy</span>';
      btn.addEventListener('click', async () => {
        const text = getText();
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
          btn.innerHTML = CHECK_SVG + '<span>Copied</span>';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.innerHTML = COPY_SVG + '<span>Copy</span>';
            btn.classList.remove('copied');
          }, 1500);
        } catch (e) { console.error('Copy failed:', e); }
      });
      return btn;
    }

    function enhanceCodeBlocks(container) {
      container.querySelectorAll('.code-block').forEach(block => {
        const header = block.querySelector('.code-header');
        const codeEl = block.querySelector('code');
        if (!header || !codeEl || header.querySelector('.code-copy')) return;
        const btn = createCopyButton(() => codeEl.textContent);
        btn.classList.add('code-copy');
        header.appendChild(btn);
      });
    }

    // ---------- Message rendering ----------
    function addMessage(role, text, opts = {}) {
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;

      const content = document.createElement('div');
      content.className = 'msg-content';
      if (role === 'ai') {
        content.innerHTML = renderMarkdown(text);
      } else {
        content.textContent = text;
      }
      wrap.appendChild(content);

      const actions = document.createElement('div');
      actions.className = 'msg-actions';
      actions.appendChild(createCopyButton(() => text));
      wrap.appendChild(actions);

      messagesDiv.appendChild(wrap);
      if (role === 'ai') enhanceCodeBlocks(wrap);
      if (opts.animate !== false) scrollToBottom(true);
      return wrap;
    }

    // ---------- Conversation store ops ----------
    function createConversation() {
      const id = 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      const now = Date.now();
      const conv = {
        id,
        title: 'New chat',
        createdAt: now,
        updatedAt: now,
        messages: [] // includes system-less list: [{role, content}]
      };
      store.unshift(conv);
      saveStore(store);
      return conv;
    }

    function findConversation(id) {
      return store.find(c => c.id === id);
    }

    function updateConversation(id, patch) {
      const c = findConversation(id);
      if (!c) return;
      Object.assign(c, patch, { updatedAt: Date.now() });
      saveStore(store);
    }

    function deleteConversation(id) {
      store = store.filter(c => c.id !== id);
      saveStore(store);
      if (activeId === id) {
        activeId = null;
        setActiveId(null);
        startNewChat();
      }
      renderSidebar();
    }

    // ---------- Sidebar rendering ----------
    function renderSidebar() {
      convList.innerHTML = '';
      if (store.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-convs';
        empty.textContent = 'No chats yet';
        convList.appendChild(empty);
        return;
      }
      // Sort by updatedAt desc
      const sorted = [...store].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      for (const c of sorted) {
        const item = document.createElement('div');
        item.className = 'conv-item' + (c.id === activeId ? ' active' : '');
        item.title = c.title;

        const title = document.createElement('div');
        title.className = 'conv-title';
        title.textContent = c.title;
        item.appendChild(title);

        const del = document.createElement('button');
        del.className = 'conv-delete';
        del.type = 'button';
        del.title = 'Delete chat';
        del.innerHTML = TRASH_SVG;
        del.addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm('Delete this chat?')) deleteConversation(c.id);
        });
        item.appendChild(del);

        item.addEventListener('click', () => {
          loadConversation(c.id);
          if (isMobile()) {
            shell.classList.remove('sidebar-mobile-open');
            backdrop.classList.remove('visible');
          }
        });

        convList.appendChild(item);
      }
    }

    // ---------- Loading a conversation ----------
    function loadConversation(id) {
      const conv = findConversation(id);
      if (!conv) return;

      activeId = id;
      setActiveId(id);
      conversation = conv.messages.slice();

      // Clear and re-render
      messagesDiv.innerHTML = '';

      if (conversation.length === 0) {
        app.classList.remove('state-chatting');
        app.classList.add('state-initial');
      } else {
        app.classList.remove('state-initial');
        app.classList.add('state-chatting');
        for (const m of conversation) {
          addMessage(m.role, m.content, { animate: false });
        }
        requestAnimationFrame(() => {
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });
      }

      renderSidebar();
    }

    // ---------- New chat ----------
    function startNewChat() {
      activeId = null;
      setActiveId(null);
      conversation = [];
      messagesDiv.innerHTML = '';
      app.classList.remove('state-chatting');
      app.classList.add('state-initial');
      renderSidebar();
      input.focus();
    }

    newChatBtn.addEventListener('click', () => {
      startNewChat();
      if (isMobile()) {
        shell.classList.remove('sidebar-mobile-open');
        backdrop.classList.remove('visible');
      }
    });

    // ---------- Streaming send ----------
    async function send() {
      const text = input.value.trim();
      if (!text || isWaiting) return;

      isWaiting = true;
      setButtonMode('stop');
      input.value = '';
      input.style.height = 'auto';

      // Ensure there's an active conversation
      if (!activeId) {
        const conv = createConversation();
        activeId = conv.id;
        setActiveId(activeId);
      }

      if (app.classList.contains('state-initial')) {
        app.classList.remove('state-initial');
        app.classList.add('state-chatting');
      }

      addMessage('user', text);
      conversation.push({ role: 'user', content: text });

      // Persist user message + set title if it's the first message
      const conv = findConversation(activeId);
      if (conv) {
        conv.messages = conversation.slice();
        if (conv.title === 'New chat' && conv.messages.length === 1) {
          conv.title = makeTitle(text);
        }
        conv.updatedAt = Date.now();
        saveStore(store);
        renderSidebar();
      }

      // Create AI placeholder
      const wrap = document.createElement('div');
      wrap.className = 'msg ai';
      const contentEl = document.createElement('div');
      contentEl.className = 'msg-content';
      contentEl.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
      wrap.appendChild(contentEl);
      messagesDiv.appendChild(wrap);
      scrollToBottom(true);

      const abortController = new AbortController();
      currentAbortController = abortController;

      let fullText = '';
      let rafScheduled = false;

      const scheduleRender = () => {
        if (rafScheduled) return;
        rafScheduled = true;
        requestAnimationFrame(() => {
          rafScheduled = false;
          if (fullText) {
            contentEl.innerHTML = renderMarkdown(fullText) + '<span class="stream-cursor"></span>';
            enhanceCodeBlocks(wrap);
            scrollToBottom();
          }
        });
      };

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: conversation,
            webSearchEnabled: webSearchEnabled
          }),
          signal: abortController.signal
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
          contentEl.textContent = `⚠️ Error: ${errData.error}`;
          return;
        }

        const ct = res.headers.get('content-type') || '';
        if (!ct.includes('text/event-stream')) {
          const data = await res.json();
          if (data.error) {
            contentEl.textContent = `⚠️ Error: ${data.error}`;
          } else {
            const reply = data.choices[0].message.content;
            contentEl.innerHTML = renderMarkdown(reply);
            enhanceCodeBlocks(wrap);
            conversation.push({ role: 'assistant', content: reply });
            persistConversation();
          }
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith('data:')) continue;
            const data = trimmed.slice(5).trim();
            if (!data || data === '[DONE]') continue;
            try {
              const json = JSON.parse(data);
              const delta = json.choices?.[0]?.delta?.content;
              if (delta) {
                fullText += delta;
                scheduleRender();
              }
            } catch (e) { /* ignore */ }
          }
        }

        contentEl.innerHTML = renderMarkdown(fullText || '(no response)');
        enhanceCodeBlocks(wrap);
        if (fullText) {
          conversation.push({ role: 'assistant', content: fullText });
          persistConversation();
        }

      } catch (err) {
        if (err.name === 'AbortError') {
          if (fullText) {
            contentEl.innerHTML = renderMarkdown(fullText);
            enhanceCodeBlocks(wrap);
            conversation.push({ role: 'assistant', content: fullText });
            persistConversation();
          } else {
            contentEl.textContent = '(stopped)';
          }
        } else {
          contentEl.textContent = `⚠️ Network error: ${err.message}`;
        }
      } finally {
        if (!wrap.querySelector('.msg-actions')) {
          const actions = document.createElement('div');
          actions.className = 'msg-actions';
          actions.appendChild(createCopyButton(() => fullText));
          wrap.appendChild(actions);
        }
        isWaiting = false;
        currentAbortController = null;
        setButtonMode('send');
        input.focus();
      }
    }

    function persistConversation() {
      if (!activeId) return;
      const conv = findConversation(activeId);
      if (!conv) return;
      conv.messages = conversation.slice();
      conv.updatedAt = Date.now();
      saveStore(store);
      renderSidebar();
    }

    function setButtonMode(mode) {
      if (mode === 'stop') {
        iconSend.style.display = 'none';
        iconStop.style.display = 'block';
        sendBtn.disabled = false;
        sendBtn.setAttribute('aria-label', 'Stop');
      } else {
        iconSend.style.display = 'block';
        iconStop.style.display = 'none';
        sendBtn.disabled = false;
        sendBtn.setAttribute('aria-label', 'Send');
      }
    }

    // ---------- Button handlers ----------
    sendBtn.addEventListener('click', () => {
      if (isWaiting && currentAbortController) currentAbortController.abort();
      else send();
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!isWaiting) send();
      }
    });

    // ---------- Init ----------
    function init() {
      // Handle resize: make sure state is correct
      window.addEventListener('resize', () => {
        if (isMobile()) {
          shell.classList.remove('sidebar-collapsed');
          if (!shell.classList.contains('sidebar-mobile-open')) {
            backdrop.classList.remove('visible');
          }
        } else {
          shell.classList.remove('sidebar-mobile-open');
          backdrop.classList.remove('visible');
        }
      });

      renderSidebar();

      if (activeId && findConversation(activeId)) {
        loadConversation(activeId);
      } else {
        startNewChat();
      }

      input.focus();
    }

    init();
  </script>
</body>
</html>
