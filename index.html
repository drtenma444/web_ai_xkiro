<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lessbot</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2937;
      --muted: #9ca3af;
      --border: #eaeaea;
      --user-bubble: #f2f2f2;
      --user-text: #1f2937;
      --ai-text: #1f2937;
      --input-bg: #f4f4f5;
      --input-border: #e4e4e7;
      --input-text: #1f2937;
      --accent: #1f2937;
      --send-bg: #1f2937;
      --send-text: #ffffff;
      --send-disabled: #d1d5db;
    }

    html[data-theme="dark"] {
      --bg: #191919;
      --text: #ececec;
      --muted: #7a7a7a;
      --border: #2a2a2a;
      --user-bubble: #2a2a2a;
      --user-text: #ececec;
      --ai-text: #ececec;
      --input-bg: #2a2a2a;
      --input-border: #2a2a2a;
      --input-text: #ececec;
      --accent: #ececec;
      --send-bg: #ececec;
      --send-text: #191919;
      --send-disabled: #404040;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.55;
      transition: background 0.2s ease, color 0.2s ease;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 860px;
      margin: 0 auto;
      position: relative;
    }

    /* ---------- Header ---------- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
      transition: border-color 0.2s ease;
    }

    .brand {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    #theme-toggle {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
      padding: 0;
    }

    #theme-toggle:hover {
      background: var(--user-bubble);
    }

    #theme-toggle svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #icon-sun, #icon-moon { display: none; }
    html[data-theme="light"] #icon-moon { display: block; }
    html[data-theme="dark"]  #icon-sun  { display: block; }

    /* ---------- Messages ---------- */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1.5rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 6px;
    }

    /* ---------- Welcome ---------- */
    #welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 1.5rem 4rem;
      max-width: 620px;
      margin: 0 auto;
      width: 100%;
      transition: opacity 0.25s ease;
    }

    #welcome.hidden { display: none; }

    #welcome h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
    }

    #welcome p {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0;
    }

    .msg {
      animation: fade 0.2s ease both;
      max-width: 100%;
    }

    @keyframes fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .msg.ai {
      color: var(--ai-text);
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 15px;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: var(--user-text);
      padding: 0.55rem 0.9rem;
      border-radius: 18px;
      border-bottom-right-radius: 6px;
      max-width: 78%;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      padding: 0.25rem 0;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      opacity: 0.5;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30%           { transform: translateY(-4px); opacity: 1; }
    }

    /* ---------- Input ---------- */
    #input-area {
      padding: 1rem 1.5rem calc(1rem + env(safe-area-inset-bottom));
      background: var(--bg);
      flex-shrink: 0;
      transition: background 0.2s ease;
    }

    .input-wrap {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 24px;
      padding: 0.3rem 0.3rem 0.3rem 1rem;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .input-wrap:focus-within {
      border-color: var(--muted);
    }

    #input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--input-text);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      max-height: 160px;
      padding: 0.55rem 0;
      scrollbar-width: none;
    }

    #input::-webkit-scrollbar { display: none; }
    #input::placeholder { color: var(--muted); }

    #send-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--send-bg);
      color: var(--send-text);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    #send-btn:hover:not(:disabled) { opacity: 0.85; }
    #send-btn:active:not(:disabled) { transform: scale(0.95); }

    #send-btn:disabled {
      background: var(--send-disabled);
      cursor: not-allowed;
    }

    #send-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 640px) {
      header { padding: 0.75rem 1rem; }
      #messages { padding: 1.25rem 1rem 0.5rem; }
      #input-area { padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom)); }
      #welcome { padding: 0 1rem 3rem; }
      #welcome h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">Lessbot</div>
      <button id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
        <svg id="icon-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg id="icon-moon" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <div id="welcome">
      <h1>What's on your mind?</h1>
      <p>Ask anything — questions, ideas, code, or just a chat.</p>
    </div>

    <div id="messages"></div>

    <div id="input-area">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="Message" autocomplete="off"></textarea>
        <button id="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24">
            <path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a1 1 0 0 0-1.39 1.12L3.5 11l11.5 1-11.5 1-1.49 6.28a1 1 0 0 0 1.39 1.12z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    // ---------- Theme ----------
    const themeToggle = document.getElementById('theme-toggle');
    const root = document.documentElement;

    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', savedTheme || (systemPrefersDark ? 'dark' : 'light'));

    themeToggle.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    // ---------- Chat ----------
    const messagesDiv = document.getElementById('messages');
    const welcome = document.getElementById('welcome');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');

    let conversation = [];
    let isWaiting = false;

    function autoGrow() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    }
    input.addEventListener('input', autoGrow);

    function scrollToBottom() {
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      messagesDiv.appendChild(div);
      scrollToBottom();
      return div;
    }

    function addTyping() {
      const div = document.createElement('div');
      div.className = 'msg ai';
      div.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
      messagesDiv.appendChild(div);
      scrollToBottom();
      return div;
    }

    async function send() {
      const text = input.value.trim();
      if (!text || isWaiting) return;

      isWaiting = true;
      sendBtn.disabled = true;
      input.value = '';
      autoGrow();

      welcome.classList.add('hidden');

      addMessage('user', text);
      conversation.push({ role: 'user', content: text });

      const typingEl = addTyping();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: conversation })
        });
        const data = await res.json();

        typingEl.remove();

        if (data.error) {
          addMessage('ai', `Error: ${data.error}`);
        } else {
          const reply = data.choices[0].message.content;
          addMessage('ai', reply);
          conversation.push({ role: 'assistant', content: reply });
        }
      } catch (err) {
        typingEl.remove();
        addMessage('ai', `Network error: ${err.message}`);
      }

      isWaiting = false;
      sendBtn.disabled = false;
      input.focus();
    }

    sendBtn.addEventListener('click', send);

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    window.addEventListener('load', () => input.focus());
  </script>
</body>
</html>
